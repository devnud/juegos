<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos Web - Página Principal</title>
  <!-- Estilos comunes -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Estilos específicos para index -->
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <header>
    <h1>Juegos Web</h1>
    <p>Elige un juego para comenzar</p>
  </header>

  <main>
    <div class="cards-container">
      <!-- Tarjeta para Tres en Raya -->
      <a href="games/tres-en-raya.html" class="card">
        <img src="assets/images/tres-en-raya.svg" alt="Imagen de Tres en Raya">
        <div class="card-content">
          <h2>Tres en Raya</h2>
        </div>
      </a>
      
      <!-- Tarjeta para Damas -->
      <a href="games/damas.html" class="card">
        <img src="assets/images/damas.svg" alt="Imagen de Damas">
        <div class="card-content">
          <h2>Damas</h2>
        </div>
      </a>
      
      <!-- Tarjeta para Serpiente -->
      <a href="games/serpiente.html" class="card">
        <img src="assets/images/serpiente.svg" alt="Imagen del juego Serpiente">
        <div class="card-content">
          <h2>Serpiente</h2>
        </div>
      </a>
      
      <!-- Tarjeta para Tetris -->
      <a href="games/tetris.html" class="card">
        <img src="assets/images/tetris.svg" alt="Imagen de Tetris">
        <div class="card-content">
          <h2>Tetris</h2>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Juegos Web</p>
  </footer>
</body>
</html>
